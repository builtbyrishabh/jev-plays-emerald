[project]
name = "jev-plays-emerald"
version = "0.1.0"
description = "Watch Jev choose a starter and play Pokemon Emerald live"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp==3.10.11",
    "aiortc==1.10.1",
    "apispec==6.3.1",
    "cffi==1.17.1",
    "confz==2.0.1",
    "darkdetect==0.8.0",
    "discord-webhook==1.2.1",
    "notify-py==0.3.43",
    "numpy==2.1.3",
    "obsws-python==1.6.2",
    "pillow==10.4.0",
    "plyer==2.1.0",
    "pyperclip3==0.4.1",
    "pypresence==4.3.0",
    "rich==13.5.3",
    "ruamel-yaml==0.18.17",
    "setuptools==84.0.0",
    "show-in-file-manager==1.1.6",
    "sounddevice==0.4.7",
    "ttkthemes==3.2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_plays_emerald"]
